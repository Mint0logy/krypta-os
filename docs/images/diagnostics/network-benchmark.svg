<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" role="img" aria-labelledby="title desc">
  <title id="title">Network benchmark dashboard</title>
  <desc id="desc">Android mobile 5G and Wi-Fi download, upload, and ping measurements with a download speed comparison.</desc>
  <rect width="800" height="455" fill="#0D1117"/>
  <rect x="16" y="16" width="768" height="423" rx="12" fill="#1C2128" stroke="#30363D"/>
  <text x="80" y="70" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">MOBILE 5G</text>
  <text x="80" y="124" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">70.68 Mbps</text>
  <text x="80" y="151" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Download</text>
  <text x="80" y="190" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600">34.56 Mbps</text>
  <text x="80" y="214" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Upload</text>
  <text x="80" y="251" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600">22 ms</text>
  <text x="80" y="275" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Ping</text>
  <line x1="400" y1="54" x2="400" y2="276" stroke="#30363D"/>
  <text x="440" y="70" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18">WI-FI</text>
  <text x="440" y="124" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="36" font-weight="700">209.15 Mbps</text>
  <text x="440" y="151" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Download</text>
  <text x="440" y="190" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600">24.64 Mbps</text>
  <text x="440" y="214" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Upload</text>
  <text x="440" y="251" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="600">29 ms</text>
  <text x="440" y="275" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Ping</text>
  <line x1="48" y1="294" x2="752" y2="294" stroke="#30363D"/>
  <text x="48" y="328" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600">Download speed comparison (Mbps)</text>
  <text x="48" y="356" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Mobile 5G</text>
  <rect x="48" y="365" width="600" height="12" rx="6" fill="#30363D"/>
  <rect x="48" y="365" width="203" height="12" rx="6" fill="#64748B"/>
  <text x="678" y="376" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">70.68</text>
  <text x="48" y="399" fill="#8B949E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14">Wi-Fi</text>
  <rect x="48" y="408" width="600" height="12" rx="6" fill="#30363D"/>
  <rect x="48" y="408" width="600" height="12" rx="6" fill="#16A34A"/>
  <text x="678" y="419" fill="#E6EDF3" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15" font-weight="600">209.15</text>
  <circle cx="56" cy="424" r="8" fill="#16A34A"/>
  <path d="M52 424l3 3 5-7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="72" y="428" fill="#16A34A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="700">Both connectivity tests passed under Android.</text>
</svg>
